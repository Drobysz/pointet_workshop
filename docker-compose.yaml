name: workshop-commerce

x-api-runtime: &api-runtime
  image: workshop-commerce-api
  env_file:
    - ./api/.env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: ${STOREFRONT_URL:-http://localhost:${HTTP_PORT:-8080}}
    ADMIN_URL: ${ADMIN_URL:-http://admin.localhost:${HTTP_PORT:-8080}}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${POSTGRES_DB:-workshop}
    DB_USERNAME: ${POSTGRES_USER:-workshop}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    AUTH_PENDING_STORE: redis
    # The storefront's global context consumes the token on its home page.
    FRONTEND_URL: ${STOREFRONT_URL:-http://localhost:${HTTP_PORT:-8080}}
    FRONTEND_VERIFY_URL: ${STOREFRONT_URL:-http://localhost:${HTTP_PORT:-8080}}/home
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-${STOREFRONT_URL:-http://localhost:${HTTP_PORT:-8080}},${ADMIN_URL:-http://admin.localhost:${HTTP_PORT:-8080}},http://localhost:${APP_PORT:-3000},http://127.0.0.1:${APP_PORT:-3000},http://localhost:${ADMIN_PORT:-3000},http://127.0.0.1:${ADMIN_PORT:-3000}}
    AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-http://localhost:${HTTP_PORT:-8080}}
    AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-http://localhost:${HTTP_PORT:-8080}}
    AUTH_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private.pem
    AUTH_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt-public.pem
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}
    GUEST_SESSION_COOKIE_SECURE: ${SESSION_SECURE_COOKIE:-false}
  volumes:
    - ./api:/var/www/html
    - api-vendor:/var/www/html/vendor
    - ./api/storage/keys:/run/secrets:ro
  networks: [commerce]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workshop}
      POSTGRES_USER: ${POSTGRES_USER:-workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workshop} -d ${POSTGRES_DB:-workshop}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [commerce]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [commerce]

  api:
    <<: *api-runtime
    build:
      context: ./api
    command: sh -c "php artisan migrate --force && php artisan serve --no-reload --host=0.0.0.0 --port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12

  queue-worker:
    <<: *api-runtime
    pull_policy: never
    command: ["php", "artisan", "queue:work", "redis", "--queue=transactional-mail,translations,default", "--timeout=60"]
    restart: unless-stopped
    stop_grace_period: 65s
    depends_on:
      api:
        condition: service_healthy
        restart: true

  scheduler:
    <<: *api-runtime
    pull_policy: never
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true

  admin:
    build:
      context: ./admin
      target: production
    environment:
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://api:8000/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks: [commerce]

  app:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_APP_URL: ${STOREFRONT_URL:-http://localhost:${HTTP_PORT:-8080}}
    environment:
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://api:8000/api
      # Operator details shown in the legal documents (see app/.env.example).
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_TRADE_NAME: ${LEGAL_TRADE_NAME:-}
      LEGAL_FORM: ${LEGAL_FORM:-}
      LEGAL_SIREN: ${LEGAL_SIREN:-}
      LEGAL_SIRET: ${LEGAL_SIRET:-}
      LEGAL_REGISTRY: ${LEGAL_REGISTRY:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_VAT: ${LEGAL_VAT:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_PHONE: ${LEGAL_PHONE:-}
      LEGAL_HOSTING_NAME: ${LEGAL_HOSTING_NAME:-}
      LEGAL_HOSTING_ADDRESS: ${LEGAL_HOSTING_ADDRESS:-}
      LEGAL_HOSTING_PHONE: ${LEGAL_HOSTING_PHONE:-}
      LEGAL_MEDIATOR_NAME: ${LEGAL_MEDIATOR_NAME:-}
      LEGAL_MEDIATOR_URL: ${LEGAL_MEDIATOR_URL:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/en/home >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks: [commerce]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    environment:
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
      NGINX_ENVSUBST_FILTER: ^ADMIN_HOST$
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [commerce]

volumes:
  postgres-data:
  redis-data:
  api-vendor:

networks:
  commerce:
    driver: bridge
