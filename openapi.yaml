      operationId: getDashboardAnalytics
      description: Administrator access required. Uses daily buckets for week/month
        and monthly buckets for 6months/year. Returns only buckets with rows;
        does not fill empty periods or filter by order status. The query applies
        a lower date bound only.
      security:
        - accessCookie: []
        - bearerAuth: []
