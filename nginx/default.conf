resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
}

upstream admin_upstream {
    zone admin_upstream 64k;
    server admin:3000 resolve;
}

upstream storefront_upstream {
    zone storefront_upstream 64k;
    server app:3000 resolve;
}

map $host $frontend_upstream {
    ${ADMIN_HOST} admin_upstream;
    default storefront_upstream;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api_upstream;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_buffering off;
    }
}
