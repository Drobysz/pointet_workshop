              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Preorder"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreorderUpdateRequest"
    patch:
      tags:
        - Pre-orders
      summary: Cancel a pre-order
      operationId: patchPreordersPreorder
      description: Administrator access required. The only accepted payment_status is
        canceled, and the policy rejects paid pre-orders with 403. Because
        pre-orders are only created once paid, this operation is effectively
        reserved for records in other states. Does not refund or restock.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Preorder"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreorderUpdateRequest"
    delete:
      tags:
        - Pre-orders
      summary: Delete a pre-order
      operationId: deletePreordersPreorder
      description: Administrator access required. Paid pre-orders cannot be deleted
        (403). Deleting cascades to line snapshots and does not restock.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
  "/stripe/checkout-sessions/{sessionId}":
    parameters:
      - name: sessionId
        in: path
        required: true
        description: Stripe Checkout session identifier as returned to the success URL
          via {CHECKOUT_SESSION_ID}.
        schema:
          type: string
          pattern: ^cs_[A-Za-z0-9_]+$
    get:
      tags:
        - Pre-orders
      summary: Get pre-order checkout status
      operationId: getStripeCheckoutSessionsSessionId
      description: Lets the success page poll the private checkout session after
        returning from Stripe. The session owner (access cookie or bearer
        token), an administrator, or the guest session that started it (via
        the guest_token cookie) may read it; anyone else receives 403.
        payment_status becomes paid and preorder_id is filled once the Stripe
        webhook has been processed. Limited to 300 requests per minute.
      security:
        - accessCookie: []
        - bearerAuth: []
        - guestCookie: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PreorderCheckoutSession"
                required:
                  - data
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: optional
  /preorder/analytics:
    get:
      tags:
        - Pre-orders
      summary: List pre-order demand per product
      operationId: getPreorderAnalytics
      description: Administrator access required. Paginated products with the total
        quantity reserved through paid pre-orders, highest demand first and
        then by product id. Products without pre-orders are included with
        zero. image_url is the stored URL of the first product image, not a
        freshly signed URL.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreorderAnalyticsPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/HistoryPerPage"
  /seller/requests:
    get:
      tags:
        - Seller applications
      summary: List seller applications
      operationId: getSellerRequests
      description: Administrator access required. Paginated applications, newest first,
        optionally filtered by status.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerApplicationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SellerApplicationStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/HistoryPerPage"
    post:
      tags:
        - Seller applications
      summary: Submit a seller application
      operationId: postSellerRequests
      description: Public. Stores the application with status processing and queues an
        acknowledgment email. Submissions are deduplicated on a fingerprint of
        the normalised payload (email lower-cased), so an identical resubmission
        returns the original record; the response always reports status
        processing with no review data, even if the original has since been
        reviewed. Limited to 3 requests per 15 minutes per normalised email/IP.
      security: []
      responses:
        "201":
          description: Accepted application (new or deduplicated).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SellerApplication"
                required:
                  - data
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerApplicationCreateRequest"
  "/seller/requests/{sellerApplication}":
    parameters:
      - name: sellerApplication
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Seller applications
      summary: Get a seller application
      operationId: getSellerRequestsSellerApplication
      description: Administrator access required.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SellerApplication"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
  "/seller/requests/{sellerApplication}/response":
    parameters:
      - name: sellerApplication
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags:
        - Seller applications
      summary: Review a seller application
      operationId: postSellerRequestsSellerApplicationResponse
      description: Administrator access required. Approves or declines an application
        that is still processing, records the reviewer and response message,
        and queues the decision email to the applicant. A second review
        returns 409. Mail queueing failures are logged and do not fail the
        request.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Reviewed application.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SellerApplication"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerApplicationReviewRequest"
  /webhooks/stripe:
    post:
      tags:
        - Webhooks
      summary: Receive Stripe Checkout events
      operationId: postWebhooksStripe
      description: Called by Stripe, not by clients. The raw body must be signed with the
        configured webhook secret (Stripe-Signature with a timestamp within
        five minutes); an invalid or missing signature or non-JSON body returns
        400. Events are deduplicated by Stripe event id. For
        checkout.session.completed and checkout.session.async_payment_succeeded
        with payment_status paid, the matching checkout session (via
        metadata.preorder_checkout_session_id) is marked paid, a Preorder with
        line snapshots is created, inventory is decremented, the account basket
        is cleared, and a confirmation email is queued. An amount or currency
        mismatch returns 422. checkout.session.expired marks the session
        canceled; checkout.session.async_payment_failed marks it failed. Other
        or unmatched events are acknowledged without changes. Not rate limited;
        exempt from the Origin check because Stripe sends no Origin header.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          description: Stripe signature header (t=timestamp,v1=hex HMAC-SHA256 of
            "timestamp.body").
          schema:
            type: string
      responses:
        "200":
          description: Event received (processed or ignored).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeWebhookAck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeEvent"
  /webhooks/sendcloud:
    post:
      tags:
        - Webhooks
      summary: Receive Sendcloud parcel events
      operationId: postWebhooksSendcloud
      description: Called by Sendcloud, not by clients. Currently acknowledges every
        payload without verifying the Sendcloud-Signature header or changing
        any order; signature verification and status handling are pending.
      security: []
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendcloudWebhookAck"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: webhook
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
