        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags:
        - Users
      summary: Request an email-address change
      operationId: patchUsersUserEmail
      description: Available to the account owner or an administrator. The current email remains active while a single-use, hashed six-digit verification code is sent to the requested new address. A later request replaces the earlier pending code. Codes expire after 15 minutes by default. Limited to 10 requests per 15 minutes per authenticated user.
      security:
        - accessCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequest"
      responses:
        "202":
          description: Verification code sent; the current email is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailChangePending"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: Verification email delivery failed; code email_delivery_unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-access: authenticated
