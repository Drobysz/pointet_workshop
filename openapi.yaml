    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Must contain at least one alphabetic character and one digit.
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
          maxLength: 255
        tel:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
        language:
          type: string
          enum:
            - en
            - it
            - fr
            - ru
            - de
          default: en
        refer_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
              description: Existing user ID, if a referrer is supplied.
            - type: "null"
      example:
        email: customer@example.com
        password: workshop123
        full_name: Alex Smith
        address: 10 Example Street
        language: en
      required:
        - email
        - password
        - full_name
    VerifyRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 255
          writeOnly: true
      required:
        - token
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          maxLength: 72
          writeOnly: true
      required:
        - email
        - password
    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          writeOnly: true
          description: Fallback when the refresh_token cookie is absent or empty. A
            nonempty cookie takes precedence.
    RegistrationPending:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
        verification_url:
          type: string
          format: uri
          description: Only returned in the local application environment when a new
            verification email was sent.
      required:
        - status
    Session:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            authenticated:
              type: boolean
              const: true
          required:
            - user
            - authenticated
      required:
        - data
    Authenticated:
      type: object
      properties:
        data:
          type: object
          properties:
            authenticated:
              type: boolean
              const: true
          required:
            - authenticated
      required:
        - data
    LoggedOut:
      type: object
      properties:
        data:
          type: object
          properties:
            logged_out:
              type: boolean
              const: true
          required:
            - logged_out
      required:
        - data
    UserCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        full_name:
          type: string
          minLength: 2
          maxLength: 255
        address:
          type: string
          minLength: 1
          maxLength: 255
        tel:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
        language:
          type: string
          enum:
            - en
            - it
            - fr
            - ru
            - de
          default: en
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Must contain at least one alphabetic character and one digit.
      description: Email must be unique. Creates a verified user; a supplied role is
        not accepted by the validated payload.
      required:
        - email
        - full_name
        - address
        - password
    UserUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
          maxLength: 255
        tel:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
        language:
          type: string
          enum:
            - en
            - it
            - fr
            - ru
            - de
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Must contain at least one alphabetic character and one digit.
      description: All fields are optional. Email must remain unique. Role and
        referral changes are not supported; a password change revokes all
        refresh sessions.
    AdminCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          writeOnly: true
          description: Must contain at least one alphabetic character and one digit.
      description: Email must be unique. Creates a verified administrator.
      required:
        - email
        - full_name
        - password
    GoodWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        category_id:
          type: integer
          format: int64
          minimum: 1
        subcategory_id:
          type: integer
          format: int64
          minimum: 1
          description: Must belong to the selected category.
        price:
          oneOf:
            - type: number
              minimum: 0
              multipleOf: 0.01
            - type: string
              pattern: ^\d+(\.\d{1,2})?$
          description: Nonnegative price with at most two decimal places.
        description:
          type: string
          minLength: 1
          maxLength: 65535
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/InventoryInput"
          minItems: 1
          maxItems: 500
        material_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          uniqueItems: true
      description: All base fields and inventory are required for creation. Inventory rows
        use a free-form size label and a nonnegative quantity; null size means unsized stock.
        Referenced IDs must exist; material_ids may be empty.
      example:
        name: Oak chair
        category_id: 1
        subcategory_id: 1
        price: "125.00"
        description: Restored oak chair.
        inventory:
          - color_id: 1
            size: null
            quantity: 5
        material_ids:
          - 1
      required:
        - name
        - category_id
        - subcategory_id
        - price
        - description
        - inventory
        - material_ids
    GoodUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/GoodWriteRequest"
        - type: object
          properties:
            inventory_version:
              type: integer
              minimum: 0
              description: Version returned by the previous product response.
            inventory:
              type: array
              items:
                $ref: "#/components/schemas/InventoryInputUpdate"
              minItems: 1
              maxItems: 500
          required:
            - inventory_version
    InventoryInput:
      type: object
      properties:
        color_id:
          type: integer
          format: int64
          minimum: 1
        size:
          anyOf:
            - type: string
              maxLength: 120
            - type: "null"
        quantity:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
        - color_id
        - quantity
    InventoryInputUpdate:
      allOf:
        - $ref: "#/components/schemas/InventoryInput"
        - type: object
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
    RestockRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Units arriving for the selected color/size row.
      required:
        - quantity
    CategoryWriteRequest:
      type: object
      properties:
        name:
          &a1
          type: string
          minLength: 1
          maxLength: 255
        remove_image:
          type: boolean
          description: Remove the current image on update. Cannot be combined with image.
      description: Name must be unique among categories, excluding this category on update.
      required:
        - name
    SubcategoryWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        category_id:
          type: integer
          format: int64
          minimum: 1
      description: Category must exist; name must be unique within that category.
      required:
        - name
        - category_id
    ColorWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        hexcode:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          example: "#A47C48"
      description: Name must be unique among colors.
      required:
        - name
        - hexcode
    MaterialWriteRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      description: Name must be unique among materials.
      required:
        - name
    BasketCreateRequest:
      type: object
      properties:
        good_register_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
      description: The exact inventory row must exist and quantity must not exceed its
        stock. Replaces the quantity of a matching basket entry rather than adding to it.
      required:
        - good_register_id
        - quantity
    BasketUpdateRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
      description: Only quantity changes. It must not exceed the selected row's current stock.
      required:
        - quantity
    OrderLineRequest:
      type: object
      properties:
        good_register_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
      required:
        - good_register_id
        - quantity
    OrderCreateRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineRequest"
          minItems: 1
      description: Supply exact inventory rows to create an order. New orders are always
        processing and stock is decremented atomically.
      required:
        - items
    OrderUpdateRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
      description: Supply status to update successfully. Status is applied to the
        order and all its items.
      required:
        - status
    ImageUploadRequest:
      type: object
      properties:
        color_id:
          type: integer
          format: int64
          minimum: 1
        image:
          type: string
          format: binary
          description: JPEG, PNG, or WebP file; maximum 10,240 KiB (10 MiB).
        name:
          anyOf:
            - type: string
              maxLength: 120
            - type: "null"
        sort_order:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 65535
              default: 0
            - type: "null"
      description: The color must be assigned to this product. Images are stored on
        the configured S3 disk using bucket-owner-full-control, compatible with
        ACL-disabled buckets. A filename-derived name is used when omitted.
      required:
        - color_id
        - image
    ImageUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sort_order:
          type: integer
          minimum: 0
          maximum: 65535
      description: Rename or reorder an image. Both fields are optional; file
        replacement is not supported.
    DashboardSummary:
      type: object
      properties:
        users:
          type: integer
          minimum: 0
        orders:
          type: integer
          minimum: 0
        monthly_revenue:
          type: string
          pattern: ^\d+(\.\d+)?$
      description: Users counts customer-role users only. Monthly revenue includes
        order items in the current calendar month without filtering order
        status.
      required:
        - users
        - orders
        - monthly_revenue
    AnalyticsPoint:
      type: object
      properties:
        bucket:
          type: string
          pattern: ^\d{4}-\d{2}(-\d{2})?$
        revenue:
          oneOf:
            - type: number
            - type: string
              pattern: ^-?\d+(\.\d+)?$
          description: Uncast database aggregate; the JSON type can vary by database driver.
        units:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: ^\d+$
      required:
        - bucket
        - revenue
        - units
    TopProduct:
      type: object
      properties:
        good_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        product_name:
          type: string
        units:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: ^\d+$
        revenue:
          oneOf:
            - type: number
            - type: string
              pattern: ^-?\d+(\.\d+)?$
          description: Uncast database aggregate; the JSON type can vary by database driver.
      required:
        - good_id
        - product_name
        - units
        - revenue
    ProductStatistics:
      type: object
      properties:
        units:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: ^\d+$
        revenue:
          oneOf:
            - type: number
            - type: string
              pattern: ^-?\d+(\.\d+)?$
          description: Uncast database aggregate; the JSON type can vary by database driver.
        orders:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: ^\d+$
      required:
        - units
        - revenue
        - orders
    CategoryImage:
      type: object
      required:
        - id
        - name
        - path
        - url
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        path:
          type: string
          example: categories/1/9abe7b39-cover.png
        url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
          description: Signed S3 URL valid for one hour by default. Fetch the category
            again to refresh it; no expiring URL is persisted.
    CategoryMultipartWriteRequest:
      type: object
      required:
        - name
      properties:
        name: *a1
        image:
          type: string
          format: binary
          description: Optional JPEG, PNG or WebP cover up to 10 MiB. Replaces the current
            image.
        remove_image:
          type: string
          enum:
            - "0"
            - "1"
          description: Use 1 to remove the current cover. Do not supply together with image.
      description: Multipart creation/update. For updates send POST to
        /categories/{category} with _method=PUT or _method=PATCH. Existing
        text-only JSON requests continue to work.
