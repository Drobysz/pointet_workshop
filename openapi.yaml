  /preorders:
    get:
      tags:
        - Pre-orders
      summary: List pre-orders
      operationId: getPreorders
      description: Paginated paid pre-orders, newest first, with their line snapshots.
        Customers see their own; administrators see all and may filter by
        user_id. Search matches an exact numeric pre-order ID or a substring
        of the customer email. Only paid pre-orders exist in this collection,
        so payment_status values other than paid yield an empty page.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreorderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: authenticated
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: user_id
          in: query
          description: Administrator-only filter; ignored for customers.
          schema:
            type: integer
        - name: payment_status
          in: query
          schema:
            $ref: "#/components/schemas/PreorderPaymentStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/HistoryPerPage"
    post:
      tags:
        - Pre-orders
      summary: Start a pre-order checkout
      operationId: postPreorders
      description: Creates a private checkout session with an immutable basket snapshot
        and a Stripe Checkout session for the fixed EUR 1.00 pre-order payment,
        then returns the Stripe URL to redirect the customer to. Authenticated
        callers (access cookie or bearer token; an invalid token is treated as
        a guest) check out their stored basket and their account email; items
        and email are ignored. Guests submit items plus a contact email, and
        the response sets the guest_token cookie when the browser has none.
        The idempotency_key scopes retries per account or guest session; a
        retry returns the existing session with 200 instead of creating a new
        one. Every line must reference a visible product with enough stock,
        but stock is not reserved until payment. Requires CHECKOUT_MODE=preorder
        (otherwise 409) and a configured Stripe secret (otherwise 503). Limited
        to 120 requests per minute.
      security:
        - accessCookie: []
        - bearerAuth: []
        - guestCookie: []
        - {}
      responses:
        "201":
          description: Checkout session created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PreorderCheckoutSession"
                required:
                  - data
          headers:
            Set-Cookie:
              description: Set for anonymous callers without a valid guest session; the
                HttpOnly guest_token cookie (configurable name, one-year
                default) identifies the guest for history and checkout-status
                lookups.
              schema:
                type: string
        "200":
          description: Idempotent retry; the existing checkout session for this
            idempotency_key is returned unchanged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PreorderCheckoutSession"
                required:
                  - data
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Checkout mode is not preorder, or a guest retried an
            idempotency_key with a different contact email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed, the basket is empty, a product is no longer
            available, the requested quantity exceeds stock, or a guest omitted
            the email.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: optional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreorderCreateRequest"
