# Pointet Workshop Commerce API
# Derived from the Laravel routes, requests, resources, controllers, and policies.
openapi: 3.1.0
info:
  title: Pointet Workshop Commerce API
  version: 1.0.0
  description: >-
    Contract for the implemented Laravel routes in api/routes/api.php. All paths
    are relative to /api. Send Accept: application/json and JSON request bodies
    unless multipart/form-data is specified. Laravel also supplies HEAD handlers
    for GET routes.


    Authentication uses HttpOnly access_token and refresh_token cookies. Protected endpoints alternatively accept Authorization: Bearer <access JWT>; a nonempty access cookie takes precedence over the bearer token. Login, verification, and refresh return tokens only through Set-Cookie. Browser clients must include credentials. Cookie names, lifetimes, domain, Secure, and SameSite are configurable; defaults are 15-minute access, 30-day refresh, HttpOnly, Path=/, Secure, and SameSite=Lax. The supplied local Docker configuration disables Secure for HTTP.


    Non-safe requests with an Origin header must match the configured CORS allowlist, unless a bearer token is present. Requests without Origin pass that middleware. Public registration/login/logout endpoints are subject to this origin check as well. Authorization rules are described per operation; role requirements are not OAuth scopes.


    Laravel resources use a data envelope. Paginated collections additionally return links and meta. Form validation returns message and errors, while explicit controller failures use error.code and error.message. Decimal amounts in resource responses are strings; raw dashboard aggregates may use database-dependent numeric types.


    Inventory is stored per product/color/size row. A null size means an unsized variant. Product totals are derived from those rows and retained as a cached current_quantity for catalog responses. Product updates use inventory_version for optimistic concurrency; additive stock arrivals use the dedicated restock operation.


    Regular GET endpoints are limited to 300 requests/minute and ordinary POST, PATCH, PUT, and DELETE endpoints to 120 requests/minute. Authenticated requests are keyed by user ID; public requests are keyed by IP address. Local environments multiply configurable limits by default. Login, registration, password changes, email-code requests and verification, and refresh-token rotation use the dedicated limits described on their operations. All rate-limit failures return the standard JSON error envelope with HTTP 429 and Laravel retry headers.


    Guest checkout uses an HttpOnly guest_token cookie (name, lifetime, domain, and Secure are configurable; defaults are one year, Path=/, SameSite=Lax, and Secure outside the local environment). It is created the first time an anonymous visitor starts a pre-order checkout and is the only credential accepted by the guest order and pre-order history endpoints. Guest baskets live in the browser: the API validates them on request and never stores basket rows for guests. Guest endpoints do not return 401; an unknown, expired, or revoked guest cookie yields an empty page or 404.


    Pre-order checkout is a fixed EUR 1.00 Stripe Checkout payment per basket. POST /preorders records a private checkout session with an immutable basket snapshot and returns the Stripe payment URL. A pre-order exists only after the signed Stripe webhook confirms the payment; at that point stock is decremented, the authenticated basket is cleared, and a confirmation email is queued. Pre-order history endpoints therefore list paid pre-orders only. Checkout requires CHECKOUT_MODE=preorder and a configured Stripe secret.


    Catalog labels (product, category, subcategory, color and material names) are localized. Public reads return each label in the language selected with the locale query parameter or the Accept-Language header (en, fr, de, it, ru), falling back to the record's source language when no translation exists. Product descriptions are never translated and are always returned as written. Administrators pass include_translations=1 (automatic on /admin/goods and on every catalog mutation response) to receive the source label together with the source_locale and translations blocks, and may send source_locale and translations with catalog mutations. Missing translations are produced asynchronously by the DeepL integration on the translations queue.


    Successful sign-in, verification, and refresh responses also set a one-year HttpOnly workshop_device cookie that identifies the browser. A sign-in from a browser without a recognised device cookie while another session is active queues a new-device notification email. Logout does not clear this cookie.
  x-source-files:
    - api/routes/api.php
    - api/app/Http/Controllers
    - api/app/Http/Requests
    - api/app/Http/Resources
    - api/app/Http/Middleware
    - api/app/Policies
    - api/config/auth_tokens.php
    - api/config/checkout.php
    - api/config/guest_sessions.php
    - api/config/rate_limits.php
    - api/app/Services/Checkout
    - api/app/Services/SellerApplications
    - api/app/Services/Translation
    - api/config/translation.php
servers:
  - url: /api
    description: Same-origin API (recommended behind the configured reverse proxy).
  - url: http://localhost:8080/api
    description: Default Docker Compose reverse proxy.
tags:
  - name: Authentication
    description: Registration, verification, and cookie session lifecycle.
  - name: Goods
    description: Public product catalog, per-color/size inventory, and administrator product management.
  - name: Categories
    description: Product categories.
  - name: Subcategories
    description: Category-specific subcategories.
  - name: Colors
    description: Product colors.
  - name: Materials
    description: Product materials.
  - name: Users
    description: Customer profiles and administrator user management.
  - name: Administrators
    description: Administrator account provisioning and lookup.
  - name: Basket
    description: Current-user basket, authorized entry management, and stateless guest basket validation.
  - name: Orders
    description: Order creation, account and guest order history, and administrator status changes.
  - name: Pre-orders
    description: Fixed-price Stripe pre-order checkout, account and guest pre-order history, and administrator management.
  - name: Seller applications
    description: Public seller onboarding requests and administrator review.
  - name: Webhooks
    description: Inbound Stripe and Sendcloud callbacks.
  - name: Translations
    description: Automatic catalog label translation status and regeneration.
  - name: Product images
    description: S3-backed product-color image management.
  - name: Dashboard
    description: Administrator reporting and product statistics.
security: []
paths:
  /account/register:
    post:
      tags:
        - Authentication
      summary: Request account registration
      operationId: postAccountRegister
      description: Normalizes the email address and sends a verification link for a
        new account. Returns pending for existing accounts too. Pending tokens
        expire after 24 hours by default. Limited to 10 requests/minute per
        normalized email/IP pair.
      security: []
      responses:
        "202":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPending"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
        "502":
          description: Verification email delivery failed; code email_delivery_unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
  /account/verify:
    post:
      tags:
        - Authentication
      summary: Verify registration and start a session
      operationId: postAccountVerify
      description: Consumes a single-use verification token, creates a verified
        customer, and sets both session cookies. Limited to 10 requests/minute
        per IP.
      security: []
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          headers:
            Set-Cookie:
              description: Multiple Set-Cookie headers set access_token and refresh_token (or
                expire both on logout/failure). HttpOnly; Path=/; SameSite=Lax
                by default. Secure, names, domain, and lifetimes are
                configurable. Tokens are not returned in JSON. Successful
                sign-in, verification, and refresh responses also set the
                one-year HttpOnly workshop_device cookie.
              schema:
                type: string
        "400":
          description: Invalid or expired verification token; code
            verification_token_invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Previously consumed token (verification_token_reused), or duplicate
            email (duplicate_email).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Sign in
      operationId: postAuthLogin
      description: Sets access and refresh cookies. Default lifetimes are 15 minutes
        and 30 days respectively. Invalid email/password combinations return
        invalid_credentials. Limited to 10 requests per minute per normalized
        email/IP.
      security: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          headers:
            Set-Cookie:
              description: Multiple Set-Cookie headers set access_token and refresh_token (or
                expire both on logout/failure). HttpOnly; Path=/; SameSite=Lax
                by default. Secure, names, domain, and lifetimes are
                configurable. Tokens are not returned in JSON. Successful
                sign-in, verification, and refresh responses also set the
                one-year HttpOnly workshop_device cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate the refresh session
      operationId: postAuthRefresh
      description: Uses the refresh cookie or the body fallback; the cookie takes
        precedence. Rotates both cookies. A replayed token revokes all active
        refresh sessions for the account. Missing/expired tokens return
        refresh_token_invalid; replay returns refresh_token_reused. Limited to
        60 requests/minute per IP.
      security:
        - refreshCookie: []
        - {}
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Authenticated"
          headers:
            Set-Cookie:
              description: Multiple Set-Cookie headers set access_token and refresh_token (or
                expire both on logout/failure). HttpOnly; Path=/; SameSite=Lax
                by default. Secure, names, domain, and lifetimes are
                configurable. Tokens are not returned in JSON. Successful
                sign-in, verification, and refresh responses also set the
                one-year HttpOnly workshop_device cookie.
              schema:
                type: string
        "401":
          description: Refresh token invalid or reused; both cookies are cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          headers:
            Set-Cookie:
              description: Multiple Set-Cookie headers set access_token and refresh_token (or
                expire both on logout/failure). HttpOnly; Path=/; SameSite=Lax
                by default. Secure, names, domain, and lifetimes are
                configurable. Tokens are not returned in JSON. Successful
                sign-in, verification, and refresh responses also set the
                one-year HttpOnly workshop_device cookie.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: public
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Sign out the current refresh session
      operationId: postAuthLogout
      description: Revokes the supplied refresh cookie or body token when present and
        clears both cookies. Succeeds even without a valid session.
        Already-issued access JWTs remain valid until expiry. Uses the regular
        API write limit of 120 requests/minute.
      security:
        - refreshCookie: []
        - {}
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggedOut"
          headers:
            Set-Cookie:
              description: Multiple Set-Cookie headers set access_token and refresh_token (or
                expire both on logout/failure). HttpOnly; Path=/; SameSite=Lax
                by default. Secure, names, domain, and lifetimes are
                configurable. Tokens are not returned in JSON. Successful
                sign-in, verification, and refresh responses also set the
                one-year HttpOnly workshop_device cookie.
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: public
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
  /auth/logout-all:
    post:
      tags:
        - Authentication
      summary: Sign out all refresh sessions
      operationId: postAuthLogoutAll
      description: Revokes every refresh session for the authenticated account and
        clears this browser cookie pair. Already-issued access JWTs remain valid
        until expiry. Uses the regular API write limit of 120 requests/minute.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggedOut"
          headers:
            Set-Cookie:
              description: Multiple Set-Cookie headers set access_token and refresh_token (or
                expire both on logout/failure). HttpOnly; Path=/; SameSite=Lax
                by default. Secure, names, domain, and lifetimes are
                configurable. Tokens are not returned in JSON. Successful
                sign-in, verification, and refresh responses also set the
                one-year HttpOnly workshop_device cookie.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: authenticated
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get the authenticated user
      operationId: getAuthMe
      description: Get the authenticated user. Uses the regular API read limit
        of 300 requests/minute.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: authenticated
  /goods:
    get:
      tags:
        - Goods
      summary: List catalog products
      operationId: getGoods
      description: Public catalog of visible products ordered by descending ID. Search matches product
        name, its translation in the requested language, or description; supports category, subcategory, and price filters. Each
        product contains complete category, subcategory, materials, inventory, and
        colors-with-images data.
      security: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodPage"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: public
      parameters:
        - $ref: "#/components/parameters/Locale"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IncludeTranslations"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - name: category_id
          in: query
          description: Category ID filter.
          schema:
            type: integer
        - name: subcategory_id
          in: query
          description: Subcategory ID filter.
          schema:
            type: integer
        - name: min_price
          in: query
          description: Inclusive minimum price.
          schema:
            type: number
            minimum: 0
        - name: max_price
          in: query
          description: Inclusive maximum price; validated with gte:min_price, so provide a
            minimum price no greater than this value.
          schema:
            type: number
    post:
      tags:
        - Goods
      summary: Create a product
      operationId: postGoods
      description: Administrator access required. Create a product.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Good"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodWriteRequest"
  "/goods/{good}":
    parameters:
      - name: good
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Goods
      summary: Get product details
      operationId: getGoodsGood
      description: Returns a visible product with category, subcategory, materials,
        per-color inventory rows, and images grouped by color and ordered by sort_order.
      security: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Good"
                required:
                  - data
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: public
    put:
      tags:
        - Goods
      summary: Replace product fields and assignments
      operationId: putGoodsGood
      description: Administrator access required. Base fields, materials, and the complete
        per-color/size inventory are replaced atomically. Send the current inventory_version;
        stale edits return 409. Existing row IDs preserve stock history and may only change
        quantity. Detaching a color with product images returns 409.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Good"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoodUpdateRequest"
    delete:
      tags:
        - Goods
      summary: Delete a product
      operationId: deleteGoodsGood
      description: Administrator access required. Deletes the product. Historic order
        item snapshots remain and their good_id becomes null.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
  /admin/goods:
    get:
      tags:
        - Goods
      summary: List products for administration
      operationId: getAdminGoods
      description: Administrator access required. Returns visible and hidden products
        with the same filters and pagination as the public catalog.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoodPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - name: category_id
          in: query
          schema:
            type: integer
        - name: subcategory_id
          in: query
          schema:
            type: integer
        - name: min_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: number
  "/admin/goods/{good}":
    parameters:
      - name: good
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Goods
      summary: Get a product for administration
      operationId: getAdminGoodsGood
      description: Administrator access required. Returns a visible or hidden product,
        including its complete inventory and image data.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Good"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
  "/goods/{good}/inventory/{register}/restock":
    parameters:
      - name: good
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: register
        in: path
        required: true
        description: Inventory row identifier belonging to the product.
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags:
        - Goods
      summary: Add stock to an inventory row
      operationId: postGoodsGoodInventoryRegisterRestock
      description: Administrator access required. Adds quantity atomically to the selected
        color/size row and increments inventory_version. This operation is additive and
        does not replace other rows.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Updated product.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Good"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockRequest"
  /categories:
    get:
      tags:
        - Categories
      summary: List categories
      operationId: getCategories
      description: Complete public collection ordered by name. Search matches the
        name. Includes subcategories. The response is not paginated.
      security: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: public
      parameters:
        - $ref: "#/components/parameters/Search"
    post:
      tags:
        - Categories
      summary: Create a category
      operationId: postCategories
      description: Administrator access required. Create a category. Optional image
        upload is saved with the category in a transaction; replaced/removed
        files are cleaned up. Multipart updates may use POST with _method=PUT or
        _method=PATCH.
      security:
        - accessCookie: []
        - bearerAuth: []
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Category"
                required:
                  - data
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/ServerError"
      x-access: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryWriteRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CategoryMultipartWriteRequest"
  "/categories/{category}":
    parameters:
      - name: category
        in: path
        required: true
        description: Resource identifier.
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags:
        - Categories
      summary: Update a category
      operationId: putCategoriesCategory
      description: Administrator access required. Both PUT and PATCH require every
        field in the write schema. Optional image upload is saved with the
