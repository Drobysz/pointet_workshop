components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Access JWT cookie; takes precedence over bearer credentials when
        nonempty.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Alternative access JWT in the Authorization header.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Rotating opaque refresh token; refresh/logout also accept a JSON
        body fallback.
  parameters:
    Page:
      name: page
      in: query
      description: Page number; GET routes also support Laravel-generated HEAD requests.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Number of records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 7
    TaxonomyPerPage:
      name: per_page
      in: query
      description: Number of taxonomy records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Search:
      name: search
      in: query
      description: Case-insensitive search; matching fields are described on each operation.
      schema:
        type: string
        maxLength: 120
  responses:
    Unauthorized:
      description: Missing, expired, or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authorization denied, or a supplied Origin is not trusted for a
        non-safe request without a bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested resource does not exist. The error code can be not_found
        or request_failed depending on exception handling.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Operation conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Request rate limit exceeded; the error code is request_failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Invalid input. Form validation returns message/errors; controller
        business-rule failures return error.code=request_failed and
        error.message.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/Error"
    NoContent:
      description: Operation completed; no response body.
    ServerError:
      description: Unexpected server or storage/database failure. Error body depends
        on deployment exception handling and debug configuration.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      example:
        error:
          code: unauthenticated
          message: Authentication is required.
      required:
        - error
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      example:
        message: The name field is required.
        errors:
          name:
            - The name field is required.
      required:
        - message
        - errors
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
          maxLength: 255
        full_name:
          type: string
        address:
          type: string
          maxLength: 255
        tel:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
        language:
          type: string
          enum:
            - en
            - it
            - fr
            - ru
            - de
        role:
          type: string
          enum:
            - user
            - admin
        email_verified_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
      required:
        - id
        - email
        - full_name
        - address
        - tel
        - language
        - role
        - email_verified_at
        - created_at
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        subcategories:
          type: array
          items:
            $ref: "#/components/schemas/Subcategory"
        image_id:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
          description: Foreign key to category_images; null for categories without a cover.
        image:
          anyOf:
            - $ref: "#/components/schemas/CategoryImage"
            - type: "null"
      description: Category with optional cover. The image relationship is loaded in
        category list/create/update and product/subcategory parent-category
        responses. Subcategories are included in category list/create/update
        responses.
      required:
        - id
        - name
        - image_id
    Subcategory:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        category_id:
          type: integer
          format: int64
          minimum: 1
        category:
          $ref: "#/components/schemas/Category"
      description: The parent category is included when loaded. Nested subcategories
        in category responses omit it.
      required:
        - id
        - name
        - category_id
    Color:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        hexcode:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          example: "#A47C48"
      required:
        - id
        - name
        - hexcode
    Material:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
      required:
        - id
        - name
    Image:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        path:
          type: string
          example: goods/1/brown/front-abcdefghij.webp
        url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
          description: Signed S3 URL valid for one hour by default; refetch the resource
            to refresh it.
        sort_order:
          type: integer
          minimum: 0
          maximum: 65535
      required:
        - id
        - name
        - path
        - url
        - sort_order
    ProductColor:
      allOf:
        - $ref: "#/components/schemas/Color"
        - type: object
          properties:
            images:
              type: array
              items:
                $ref: "#/components/schemas/Image"
          required:
            - images
    InventoryRow:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        good_id:
          type: integer
          format: int64
          minimum: 1
        color_id:
          type: integer
          format: int64
          minimum: 1
        size:
          anyOf:
            - type: string
              maxLength: 120
            - type: "null"
          description: Free-form size label; null represents an unsized variant.
        quantity:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
        - id
        - good_id
        - color_id
        - size
        - quantity
    Good:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        price:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "125.00"
          description: Decimal monetary amount serialized as a string; the API does not
            expose a currency field.
        current_quantity:
          type: integer
          minimum: 0
          readOnly: true
          description: Cached sum of all inventory row quantities.
        inventory_version:
          type: integer
          minimum: 0
          readOnly: true
          description: Increments whenever inventory rows change.
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/InventoryRow"
          description: Per-color/size stock rows. A null size is unsized stock.
        description:
          type: string
        category_id:
          type: integer
          format: int64
          minimum: 1
        subcategory_id:
          type: integer
          format: int64
          minimum: 1
        subcategory:
          $ref: "#/components/schemas/Subcategory"
        category:
          $ref: "#/components/schemas/Category"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/Material"
        colors:
          type: array
          items:
            $ref: "#/components/schemas/ProductColor"
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
      description: Complete product data, including category, subcategory, materials,
        inventory, and colors with their images.
      required:
        - id
        - name
        - price
        - current_quantity
        - inventory_version
        - inventory
        - description
        - category_id
        - subcategory_id
        - category
        - subcategory
        - materials
        - colors
        - created_at
    BasketItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
        good:
          $ref: "#/components/schemas/Good"
        color:
          anyOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        good_register_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        inventory:
          anyOf:
            - $ref: "#/components/schemas/InventoryRow"
            - type: "null"
      required:
        - id
        - good_register_id
        - inventory
        - quantity
        - good
        - color
    OrderStatus:
      type: string
      enum:
        - processing
        - sent
        - delivered
        - reported
        - cancelled
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        user_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        customer_name:
          type: string
        customer_email:
          type: string
          format: email
          maxLength: 255
        status:
          $ref: "#/components/schemas/OrderStatus"
        placed_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        total:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "125.00"
          description: Decimal monetary amount serialized as a string; the API does not
            expose a currency field.
      required:
        - id
        - user_id
        - customer_name
        - customer_email
        - status
        - placed_at
        - total
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        good_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        product_name:
          type: string
        color_name:
          anyOf:
            - type: string
            - type: "null"
        size:
          anyOf:
            - type: string
            - type: "null"
          description: Size label snapshot at checkout.
        good_register_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        unit_price:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "125.00"
          description: Decimal monetary amount serialized as a string; the API does not
            expose a currency field.
        quantity:
          type: integer
          minimum: 1
        line_total:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "125.00"
          description: Decimal monetary amount serialized as a string; the API does not
            expose a currency field.
        status:
          $ref: "#/components/schemas/OrderStatus"
      required:
        - id
        - good_id
        - product_name
        - color_name
        - size
        - good_register_id
        - unit_price
        - quantity
        - line_total
        - status
    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            customer:
              anyOf:
                - $ref: "#/components/schemas/User"
                - type: "null"
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"
          required:
            - customer
            - items
    PaginationLinks:
      type: object
      properties:
        first:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        last:
