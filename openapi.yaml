      x-access: admin
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: Access JWT cookie; takes precedence over bearer credentials when
        nonempty.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Alternative access JWT in the Authorization header.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Rotating opaque refresh token; refresh/logout also accept a JSON
        body fallback.
    guestCookie:
      type: apiKey
      in: cookie
      name: guest_token
      description: Opaque HttpOnly guest session token issued by POST /preorders for
        anonymous checkouts. Configurable name; one-year default lifetime.
        Guest endpoints treat a missing or invalid cookie as an empty
        history rather than an authentication error.
  parameters:
    Page:
      name: page
      in: query
      description: Page number; GET routes also support Laravel-generated HEAD requests.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Number of records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 7
    TaxonomyPerPage:
      name: per_page
      in: query
      description: Number of taxonomy records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    HistoryPerPage:
      name: per_page
      in: query
      description: Number of records per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Case-insensitive search; matching fields are described on each operation.
      schema:
        type: string
        maxLength: 120
    Locale:
      name: locale
      in: query
      description: Language of the returned catalog labels. Overrides the Accept-Language header.
        Unsupported values are ignored.
      schema:
        type: string
        enum: [en, fr, de, it, ru, uk]
    AcceptLanguage:
      name: Accept-Language
      in: header
      description: Preferred languages of the returned catalog labels; the first supported one
        wins. Product descriptions are never translated. Without a supported
        language, labels fall back to English or to the record's source language.
      schema:
        type: string
        example: de-DE,de;q=0.9,en;q=0.8
    IncludeTranslations:
      name: include_translations
      in: query
      description: Administrative view. Returns labels in their source language together with the
        source_locale, translatable_fields and translations properties.
      schema:
        type: boolean
        default: false
  responses:
    Unauthorized:
      description: Missing, expired, or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authorization denied, or a supplied Origin is not trusted for a
        non-safe request without a bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Requested resource does not exist. The error code can be not_found
        or request_failed depending on exception handling.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Malformed request, such as an invalid webhook signature or
        payload; the error code is request_failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Operation conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Request rate limit exceeded; the error code is request_failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationFailed:
      description: Invalid input. Form validation returns message/errors; controller
        business-rule failures return error.code=request_failed and
        error.message.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/Error"
    NoContent:
      description: Operation completed; no response body.
    BadGateway:
      description: An upstream provider (Stripe) returned an unusable response; the
        error code is request_failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A required integration is not configured in this deployment; the
        error code is request_failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected server or storage/database failure. Error body depends
        on deployment exception handling and debug configuration.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      example:
        error:
          code: unauthenticated
          message: Authentication is required.
      required:
        - error
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      example:
        message: The name field is required.
        errors:
          name:
            - The name field is required.
      required:
        - message
        - errors
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        email:
          type: string
          format: email
          maxLength: 255
        full_name:
          type: string
        address:
          type: string
          maxLength: 255
        tel:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
        language:
          type: string
          enum:
            - en
            - it
            - fr
            - ru
            - de
            - uk
        role:
          type: string
          enum:
            - user
            - admin
        orders_count:
          type: integer
          minimum: 0
          readOnly: true
          description: Total orders belonging to the user.
        basket_goods_count:
          type: integer
          minimum: 0
          readOnly: true
          description: Total units across all items in the user's basket.
        email_verified_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
      required:
        - id
        - email
        - full_name
        - address
        - tel
        - language
        - role
        - orders_count
        - basket_goods_count
        - email_verified_at
        - created_at
    TranslationEntry:
      type: object
      description: One translated label. A null name means the automatic translation is still pending
        (or was skipped because the provider quota is exhausted).
      properties:
        name:
          anyOf:
            - type: string
            - type: "null"
        name_is_manual:
          type: boolean
          description: Entered by an administrator; never overwritten automatically.
        name_is_stale:
          type: boolean
          description: Automatic translation of a previous source text; regenerated by the queue.
      required: [name, name_is_manual, name_is_stale]
    TranslationBlock:
      type: object
      description: Present only when include_translations is requested or on administrative responses.
      properties:
        source_locale:
          type: string
          enum: [en, fr, de, it, ru, uk]
          description: Language the source label is written in.
        translatable_fields:
          type: array
          items:
            type: string
          example: [name]
        translations:
          type: object
          description: Keyed by every supported locale except source_locale.
          additionalProperties:
            $ref: "#/components/schemas/TranslationEntry"
    TranslationWriteFields:
      type: object
      description: Optional localization inputs accepted by every catalog mutation.
      properties:
        source_locale:
          type: string
          enum: [en, fr, de, it, ru, uk]
          description: Language the name is written in. Defaults to the Accept-Language of the request
            on create and to the stored value on update.
        translations:
          type: object
          description: Manual name translations keyed by locale. A non-empty name is stored as manual;
            null or an empty string clears a manual translation so it is regenerated
            automatically. Only the name field is accepted; descriptions are rejected with 422.
          additionalProperties:
            type: object
            properties:
              name:
                anyOf:
                  - type: string
                    maxLength: 255
                  - type: "null"
          example:
            de:
              name: Lederjacke
    TranslationUsage:
      type: object
      properties:
        enabled:
          type: boolean
          description: False when no provider key is configured; manual translations still work.
        provider:
          type: string
          example: deepl
        period:
          type: string
          example: "2026-11"
        characters_used:
          type: integer
        character_limit:
          anyOf:
            - type: integer
            - type: "null"
        exhausted:
          type: boolean
        exhausted_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
      required: [enabled, provider, period, characters_used, character_limit, exhausted, exhausted_at]
    Category:
      allOf:
        - $ref: "#/components/schemas/TranslationBlock"
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          description: Localized to the requested language; the source label when include_translations is set.
        subcategories:
          type: array
          items:
            $ref: "#/components/schemas/Subcategory"
        image_id:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
          description: Foreign key to category_images; null for categories without a cover.
        image:
          anyOf:
            - $ref: "#/components/schemas/CategoryImage"
            - type: "null"
      description: Category with optional cover. The image relationship is loaded in
        category list/create/update and product/subcategory parent-category
        responses. Subcategories are included in category list/create/update
        responses.
      required:
        - id
        - name
        - image_id
    Subcategory:
      allOf:
        - $ref: "#/components/schemas/TranslationBlock"
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          description: Localized to the requested language; the source label when include_translations is set.
        category_id:
          type: integer
          format: int64
          minimum: 1
        category:
          $ref: "#/components/schemas/Category"
      description: The parent category is included when loaded. Nested subcategories
        in category responses omit it.
      required:
        - id
        - name
        - category_id
    Color:
      allOf:
        - $ref: "#/components/schemas/TranslationBlock"
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          description: Localized to the requested language; the source label when include_translations is set.
        hexcode:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          example: "#A47C48"
      required:
        - id
        - name
        - hexcode
    Material:
      allOf:
        - $ref: "#/components/schemas/TranslationBlock"
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          description: Localized to the requested language; the source label when include_translations is set.
      required:
        - id
        - name
    Image:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        color_id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        path:
          type: string
          example: goods/1/brown/front-abcdefghij.webp
        url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
          description: Signed S3 URL valid for one hour by default; refetch the resource
            to refresh it.
        sort_order:
          type: integer
          minimum: 0
          maximum: 65535
      required:
        - id
        - color_id
        - name
        - path
        - url
        - sort_order
    ProductColor:
      allOf:
        - $ref: "#/components/schemas/Color"
        - type: object
          properties:
            images:
              type: array
              items:
                $ref: "#/components/schemas/Image"
          required:
            - images
    InventoryRow:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        good_id:
          type: integer
          format: int64
          minimum: 1
        color_id:
          type: integer
          format: int64
          minimum: 1
        size:
          anyOf:
            - type: string
              maxLength: 120
            - type: "null"
          description: Free-form size label; null represents an unsized variant.
        quantity:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
        - id
        - good_id
        - color_id
        - size
        - quantity
    Good:
      allOf:
        - $ref: "#/components/schemas/TranslationBlock"
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          description: Localized to the requested language; the source label on administrative responses.
        brand:
          type: string
          maxLength: 255
        price:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "125.00"
          description: Decimal monetary amount serialized as a string; the API does not
            expose a currency field.
        weigh:
          type: integer
          minimum: 0
          default: 0
          description: Product weight in grams.
        current_quantity:
          type: integer
          minimum: 0
          readOnly: true
          description: Cached sum of all inventory row quantities.
        inventory_version:
          type: integer
          minimum: 0
          readOnly: true
          description: Increments whenever inventory rows change.
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/InventoryRow"
          description: Per-color/size stock rows. A null size is unsized stock.
        description:
          type: string
        visible:
          type: boolean
          description: Hidden products are omitted from public catalog endpoints.
        category_id:
          type: integer
          format: int64
          minimum: 1
        subcategory_id:
          type: integer
          format: int64
          minimum: 1
        subcategory:
          $ref: "#/components/schemas/Subcategory"
        category:
          $ref: "#/components/schemas/Category"
        materials:
          type: array
          items:
            $ref: "#/components/schemas/Material"
        colors:
          type: array
          items:
            $ref: "#/components/schemas/ProductColor"
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
      description: Complete product data, including category, subcategory, materials,
        inventory, and colors with their images.
      required:
        - id
        - name
        - brand
        - price
        - weigh
        - current_quantity
        - inventory_version
        - inventory
        - description
        - visible
        - category_id
        - subcategory_id
        - category
        - subcategory
        - materials
        - colors
        - created_at
    BasketItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
        good:
          $ref: "#/components/schemas/Good"
        color:
          anyOf:
            - $ref: "#/components/schemas/Color"
            - type: "null"
        good_register_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        inventory:
          anyOf:
            - $ref: "#/components/schemas/InventoryRow"
            - type: "null"
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
          description: Product images for the selected color, ordered by sort_order.
      description: For guest basket validation, id equals the inventory row id and
        quantity is clamped to available stock.
      required:
        - id
        - good_register_id
        - inventory
        - quantity
        - good
        - color
        - images
    OrderStatus:
      type: string
      enum:
        - processing
        - sent
        - delivered
        - reported
        - cancelled
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        user_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        customer_name:
          type: string
        customer_email:
          type: string
          format: email
          maxLength: 255
        status:
          $ref: "#/components/schemas/OrderStatus"
        placed_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        total:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "125.00"
          description: Decimal monetary amount serialized as a string; the API does not
            expose a currency field.
      required:
        - id
        - user_id
        - customer_name
        - customer_email
        - status
        - placed_at
        - total
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        good_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        product_name:
          type: string
        color_name:
          anyOf:
            - type: string
            - type: "null"
        size:
          anyOf:
            - type: string
            - type: "null"
          description: Size label snapshot at checkout.
        good_register_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        unit_price:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "125.00"
          description: Decimal monetary amount serialized as a string; the API does not
            expose a currency field.
        quantity:
          type: integer
          minimum: 1
        line_total:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "125.00"
          description: Decimal monetary amount serialized as a string; the API does not
            expose a currency field.
        status:
          $ref: "#/components/schemas/OrderStatus"
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
          description: Current product images for the ordered color, ordered by
            sort_order. Empty when the product or inventory row no longer exists.
      required:
        - id
        - good_id
        - product_name
        - color_name
        - size
        - good_register_id
        - unit_price
        - quantity
        - line_total
        - status
        - images
    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          properties:
            customer:
              anyOf:
                - $ref: "#/components/schemas/User"
                - type: "null"
            items:
              type: array
              items:
                $ref: "#/components/schemas/OrderItem"
          required:
            - customer
            - items
    PaginationLinks:
      type: object
      properties:
        first:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        last:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        prev:
          anyOf:
            - type: string
              format: uri
            - type: "null"
        next:
          anyOf:
            - type: string
              format: uri
            - type: "null"
      required:
        - first
        - last
        - prev
        - next
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          minimum: 1
        from:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
        last_page:
          type: integer
          minimum: 1
        links:
          type: array
          items:
            type: object
            properties:
              url:
                anyOf:
                  - type: string
                    format: uri
                  - type: "null"
              label:
                type: string
              active:
                type: boolean
            required:
              - url
              - label
              - active
        path:
          type: string
          format: uri
        per_page:
          type: integer
          minimum: 1
        to:
          anyOf:
            - type: integer
              minimum: 1
            - type: "null"
        total:
          type: integer
          minimum: 0
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
    GoodPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Good"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - links
        - meta
    CategoryList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
      required:
        - data
    SubcategoryPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Subcategory"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - links
        - meta
    ColorPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Color"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - links
        - meta
    MaterialPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Material"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - links
        - meta
    UserPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - links
        - meta
    BasketItemList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BasketItem"
      required:
        - data
    OrderList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
      required:
        - data
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Must contain at least one alphabetic character and one digit.
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
          maxLength: 255
        tel:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
        language:
          type: string
          enum:
            - en
            - it
            - fr
            - ru
            - de
            - uk
          default: en
        refer_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
              description: Existing user ID, if a referrer is supplied.
            - type: "null"
      example:
        email: customer@example.com
        password: workshop123
        full_name: Alex Smith
        address: 10 Example Street
        language: en
      required:
        - email
        - password
        - full_name
    VerifyRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 255
          writeOnly: true
      required:
        - token
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          maxLength: 72
          writeOnly: true
      required:
        - email
        - password
    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          writeOnly: true
          description: Fallback when the refresh_token cookie is absent or empty. A
            nonempty cookie takes precedence.
    RegistrationPending:
      type: object
      properties:
        status:
          type: string
          enum:
            - pending
        verification_url:
          type: string
          format: uri
          description: Only returned in the local application environment when a new
            verification email was sent.
      required:
        - status
    Session:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            authenticated:
              type: boolean
              const: true
          required:
            - user
            - authenticated
      required:
        - data
    Authenticated:
      type: object
      properties:
        data:
          type: object
          properties:
            authenticated:
              type: boolean
              const: true
          required:
            - authenticated
      required:
        - data
    LoggedOut:
      type: object
      properties:
        data:
          type: object
          properties:
            logged_out:
              type: boolean
              const: true
          required:
            - logged_out
      required:
        - data
    UserCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        full_name:
          type: string
          minLength: 2
          maxLength: 255
        address:
          type: string
          minLength: 1
          maxLength: 255
        tel:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
        language:
          type: string
          enum:
            - en
            - it
            - fr
            - ru
            - de
            - uk
          default: en
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Must contain at least one alphabetic character and one digit.
      description: Email must be unique. Creates a verified user; a supplied role is
        not accepted by the validated payload.
      required:
        - email
        - full_name
        - address
        - password
    UserUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
          maxLength: 255
        tel:
          anyOf:
            - type: string
              maxLength: 255
            - type: "null"
        language:
          type: string
          enum:
            - en
            - it
            - fr
            - ru
            - de
            - uk
      description: All fields are optional. Email and password are prohibited here;
        use their dedicated endpoints. Role and referral changes are not supported.
    EmailChangeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: new@example.com
      required:
        - email
    EmailChangeVerificationRequest:
      type: object
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          minLength: 6
          maxLength: 6
          writeOnly: true
          example: "123456"
      required:
        - code
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          format: password
          maxLength: 72
          writeOnly: true
          example: CurrentPassword123!
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          writeOnly: true
          description: Must contain at least one alphabetic character and one digit, and differ from the current password.
          example: NewPassword123!
      required:
        - current_password
        - new_password
    EmailChangePending:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              const: pending_verification
          required:
            - status
      required:
        - data
    AdminCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 72
          writeOnly: true
          description: Must contain at least one alphabetic character and one digit.
      description: Email must be unique. Creates a verified administrator.
      required:
        - email
        - full_name
        - password
    GoodWriteRequest:
      allOf:
        - $ref: "#/components/schemas/TranslationWriteFields"
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        brand:
          type: string
          minLength: 1
          maxLength: 255
        category_id:
          type: integer
          format: int64
          minimum: 1
        subcategory_id:
          type: integer
          format: int64
          minimum: 1
          description: Must belong to the selected category.
        price:
          oneOf:
            - type: number
              minimum: 0
              multipleOf: 0.01
            - type: string
              pattern: ^\d+(\.\d{1,2})?$
          description: Nonnegative price with at most two decimal places.
        weigh:
          type: integer
          minimum: 0
          default: 0
          description: Product weight in grams.
        description:
          type: string
          minLength: 1
          maxLength: 65535
        visible:
          type: boolean
          default: true
          description: Controls whether the product appears in public catalog endpoints.
        inventory:
          type: array
          items:
            $ref: "#/components/schemas/InventoryInput"
          minItems: 1
          maxItems: 500
        material_ids:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          uniqueItems: true
      description: All base fields and inventory are required for creation. Inventory rows
        use a free-form size label and a nonnegative quantity; null size means unsized stock.
        Referenced IDs must exist; material_ids may be empty.
      example:
        name: Oak chair
        brand: Atelier Nord
        category_id: 1
        subcategory_id: 1
        price: "125.00"
        weigh: 1200
        description: Restored oak chair.
        visible: true
        inventory:
          - color_id: 1
            size: null
            quantity: 5
        material_ids:
          - 1
      required:
        - name
        - brand
        - category_id
        - subcategory_id
        - price
        - description
        - inventory
        - material_ids
    GoodUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/GoodWriteRequest"
        - type: object
          properties:
            inventory_version:
              type: integer
              minimum: 0
              description: Version returned by the previous product response.
            inventory:
              type: array
              items:
                $ref: "#/components/schemas/InventoryInputUpdate"
              minItems: 1
              maxItems: 500
          required:
            - inventory_version
    InventoryInput:
      type: object
      properties:
        color_id:
          type: integer
          format: int64
          minimum: 1
        size:
          anyOf:
            - type: string
              maxLength: 120
            - type: "null"
        quantity:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
        - color_id
        - quantity
    InventoryInputUpdate:
      allOf:
        - $ref: "#/components/schemas/InventoryInput"
        - type: object
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
    RestockRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Units arriving for the selected color/size row.
      required:
        - quantity
    CategoryWriteRequest:
      allOf:
        - $ref: "#/components/schemas/TranslationWriteFields"
      type: object
      properties:
        name:
          &a1
          type: string
          minLength: 1
          maxLength: 255
        remove_image:
          type: boolean
          description: Remove the current image on update. Cannot be combined with image.
      description: Name must be unique among categories, excluding this category on update.
      required:
        - name
    SubcategoryWriteRequest:
      allOf:
        - $ref: "#/components/schemas/TranslationWriteFields"
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        category_id:
          type: integer
          format: int64
          minimum: 1
      description: Category must exist; name must be unique within that category.
      required:
        - name
        - category_id
    ColorWriteRequest:
      allOf:
        - $ref: "#/components/schemas/TranslationWriteFields"
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        hexcode:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
          example: "#A47C48"
      description: Name must be unique among colors.
      required:
        - name
        - hexcode
    MaterialWriteRequest:
      allOf:
        - $ref: "#/components/schemas/TranslationWriteFields"
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
      description: Name must be unique among materials.
      required:
        - name
    BasketCreateRequest:
      type: object
      properties:
        good_register_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
      description: The exact inventory row must exist and the resulting quantity after
        adding to any matching basket entry must not exceed its stock.
      required:
        - good_register_id
        - quantity
    BasketUpdateRequest:
      type: object
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
      description: Only quantity changes. It must not exceed the selected row's current stock.
      required:
        - quantity
    OrderLineRequest:
      type: object
      properties:
        good_register_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
      required:
        - good_register_id
        - quantity
    OrderCreateRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineRequest"
          minItems: 1
      description: Supply exact inventory rows to create an order. New orders are always
        processing and stock is decremented atomically.
      required:
        - items
    OrderUpdateRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
      description: Supply status to update successfully. Status is applied to the
        order and all its items.
      required:
        - status
    ImageUploadRequest:
      type: object
      properties:
        color_id:
          type: integer
          format: int64
          minimum: 1
        image:
          type: string
          format: binary
          description: JPEG, PNG, or WebP file; maximum 10,240 KiB (10 MiB).
        name:
          anyOf:
            - type: string
              maxLength: 120
            - type: "null"
        sort_order:
          anyOf:
            - type: integer
              minimum: 0
              maximum: 65535
              default: 0
            - type: "null"
      description: The color must be assigned to this product. Images are stored on
        the configured S3 disk using bucket-owner-full-control, compatible with
        ACL-disabled buckets. A filename-derived name is used when omitted.
      required:
        - color_id
        - image
    ImageUpdateRequest:
      type: object
      properties:
        color_id:
          type: integer
          format: int64
          minimum: 1
          description: Must be assigned to the same product.
        name:
          type: string
          minLength: 1
          maxLength: 120
        sort_order:
          type: integer
          minimum: 0
          maximum: 65535
      description: Rename, reorder, or move an image to another color assigned to
        the same product. All fields are optional; file replacement is not supported.
    DashboardSummary:
      type: object
      properties:
        users:
          type: integer
          minimum: 0
        orders:
          type: integer
          minimum: 0
        monthly_revenue:
          type: string
          pattern: ^\d+(\.\d+)?$
      description: Users counts customer-role users only. Monthly revenue includes
        order items in the current calendar month without filtering order
        status.
      required:
        - users
        - orders
        - monthly_revenue
    AnalyticsPoint:
      type: object
      properties:
        bucket:
          type: string
          pattern: ^\d{4}-\d{2}(-\d{2})?$
        revenue:
          oneOf:
            - type: number
            - type: string
              pattern: ^-?\d+(\.\d+)?$
          description: Uncast database aggregate; the JSON type can vary by database driver.
        units:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: ^\d+$
      required:
        - bucket
        - revenue
        - units
    TopProduct:
      type: object
      properties:
        good_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        product_name:
          type: string
        units:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: ^\d+$
        revenue:
          oneOf:
            - type: number
            - type: string
              pattern: ^-?\d+(\.\d+)?$
          description: Uncast database aggregate; the JSON type can vary by database driver.
      required:
        - good_id
        - product_name
        - units
        - revenue
    ProductStatistics:
      type: object
      properties:
        units:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: ^\d+$
        revenue:
          oneOf:
            - type: number
            - type: string
              pattern: ^-?\d+(\.\d+)?$
          description: Uncast database aggregate; the JSON type can vary by database driver.
        orders:
          oneOf:
            - type: integer
              minimum: 0
            - type: string
              pattern: ^\d+$
      required:
        - units
        - revenue
        - orders
    CategoryImage:
      type: object
      required:
        - id
        - name
        - path
        - url
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        path:
          type: string
          example: categories/1/9abe7b39-cover.png
        url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
          description: Signed S3 URL valid for one hour by default. Fetch the category
            again to refresh it; no expiring URL is persisted.
    CategoryMultipartWriteRequest:
      type: object
      required:
        - name
      properties:
        name: *a1
        image:
          type: string
          format: binary
          description: Optional JPEG, PNG or WebP cover up to 10 MiB. Replaces the current
            image.
        remove_image:
          type: string
          enum:
            - "0"
            - "1"
          description: Use 1 to remove the current cover. Do not supply together with image.
      description: Multipart creation/update. For updates send POST to
        /categories/{category} with _method=PUT or _method=PATCH. Existing
        text-only JSON requests continue to work.
    OrderPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - links
        - meta
    GuestBasketLineRequest:
      type: object
      properties:
        inventory_id:
          type: integer
          format: int64
          minimum: 1
          description: Inventory row (color plus optional size) identifier.
        quantity:
          type: integer
          minimum: 1
          maximum: 99
      required:
        - inventory_id
        - quantity
    GuestBasketValidationRequest:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GuestBasketLineRequest"
          maxItems: 20
          description: Browser-held basket lines. Must be present; an empty array is
            allowed and returns an empty list.
      required:
        - items
    PreorderPaymentStatus:
      type: string
      enum:
        - pending
        - paid
        - failed
        - canceled
        - refunded
    PreorderCreateRequest:
      type: object
      properties:
        idempotency_key:
          type: string
          format: uuid
          description: Client-generated key scoped to the account or guest session.
            Reusing it returns the existing checkout session.
        email:
          type: string
          format: email
          maxLength: 255
          description: Required for guests; lower-cased and trimmed. Ignored for
            authenticated callers, whose account email is used.
        items:
          type: array
          items:
            $ref: "#/components/schemas/GuestBasketLineRequest"
          maxItems: 20
          description: Guest basket lines. Ignored for authenticated callers, whose
            stored basket is used.
      description: Authenticated callers only need idempotency_key. Guests must supply
        email and items.
      required:
        - idempotency_key
    PreorderUpdateRequest:
      type: object
      properties:
        payment_status:
          type: string
          enum:
            - canceled
      required:
        - payment_status
    PreorderCheckoutSession:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Private checkout session id (also Stripe client_reference_id).
        payment_status:
          $ref: "#/components/schemas/PreorderPaymentStatus"
        payment_amount_cents:
          type: integer
          minimum: 0
          example: 100
          description: Fixed pre-order payment; currently always 100.
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: eur
          description: Lower-case ISO 4217 code; currently always eur.
        paid_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        checkout_url:
          type: string
          format: uri
          description: Stripe-hosted payment page. Omitted only when Stripe has not
            returned a URL for this session.
        preorder_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
          description: Set once the webhook has created the Preorder.
      required:
        - id
        - payment_status
        - payment_amount_cents
        - currency
        - paid_at
        - preorder_id
    PreorderRegister:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        good_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        good_register_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
        product_name:
          type: string
        color_name:
          anyOf:
            - type: string
            - type: "null"
        size:
          anyOf:
            - type: string
            - type: "null"
          description: Size label snapshot at checkout.
        original_unit_price:
          type: string
          pattern: ^\d+\.\d{2}$
          example: "125.00"
          description: Catalog price snapshot at checkout, serialized as a string. The
            pre-order payment itself is the fixed payment_amount_cents.
        quantity:
          type: integer
          minimum: 1
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
          description: Current product images for the pre-ordered color, ordered by
            sort_order. Empty when the product or inventory row no longer exists.
      required:
        - id
        - good_id
        - good_register_id
        - product_name
        - color_name
        - size
        - original_unit_price
        - quantity
        - images
    Preorder:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        user_id:
          anyOf:
            - type: integer
              format: int64
              minimum: 1
            - type: "null"
          description: Null for guest pre-orders.
        customer_name:
          type: string
          description: Account full name, or the name Stripe collected for guests
            ("Guest checkout" when none).
        customer_email:
          type: string
          format: email
          maxLength: 255
        payment_status:
          $ref: "#/components/schemas/PreorderPaymentStatus"
        payment_amount_cents:
          type: integer
          minimum: 0
          example: 100
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: eur
        paid_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        checkout_url:
          type: string
          format: uri
          description: Reserved; not emitted by the current implementation.
        registers:
          type: array
          items:
            $ref: "#/components/schemas/PreorderRegister"
          description: Line snapshots; always loaded on list and detail responses.
      required:
        - id
        - user_id
        - customer_name
        - customer_email
        - payment_status
        - payment_amount_cents
        - currency
        - paid_at
        - created_at
        - registers
    PreorderPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Preorder"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - links
        - meta
    PreorderAnalyticsRow:
      type: object
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
        product_name:
          type: string
        image_url:
          anyOf:
            - type: string
              format: uri
            - type: "null"
          description: Stored URL of the first product image by sort_order; not a signed
            URL and may be null.
        original_price:
          type: string
          pattern: ^\d+(\.\d+)?$
          example: "125.00"
          description: Current catalog price serialized as a string.
        preordered_quantity:
          type: integer
          minimum: 0
          description: Units reserved through paid pre-orders.
      required:
        - product_id
        - product_name
        - image_url
        - original_price
        - preordered_quantity
    PreorderAnalyticsPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PreorderAnalyticsRow"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - links
        - meta
    SellerApplicationStatus:
      type: string
      enum:
        - processing
        - approved
        - declined
    SellerApplicationCreateRequest:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        tel_number:
          type: string
          pattern: ^\+?[1-9][0-9]{6,14}$
          description: E.164-style digits with optional leading plus.
        country:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        brand_name:
          type: string
          maxLength: 160
        company_address:
          type: string
          maxLength: 500
        description_of_contact:
          type: string
          maxLength: 4000
        description_of_brand:
          type: string
          maxLength: 4000
        is_resident_of_eu:
          type: boolean
      required:
        - first_name
        - last_name
        - tel_number
        - country
        - email
        - brand_name
        - company_address
        - description_of_contact
        - description_of_brand
        - is_resident_of_eu
    SellerApplicationReviewRequest:
      type: object
      properties:
        approved:
          type: boolean
        response:
          type: string
          maxLength: 5000
          description: Message sent to the applicant and stored as response_message.
      required:
        - approved
        - response
    SellerApplication:
      type: object
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        first_name:
          type: string
        last_name:
          type: string
        tel_number:
          type: string
        country:
          type: string
        email:
          type: string
          format: email
        brand_name:
          type: string
        company_address:
          type: string
        description_of_contact:
          type: string
        description_of_brand:
          type: string
        isResidentOfEU:
          type: boolean
          description: Camel-cased in responses; the request field is is_resident_of_eu.
        status:
          $ref: "#/components/schemas/SellerApplicationStatus"
        reviewed_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        response_message:
          anyOf:
            - type: string
            - type: "null"
        created_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
      description: Public submission responses always report status processing with
        null reviewed_at and response_message.
      required:
        - id
        - first_name
        - last_name
        - tel_number
        - country
        - email
        - brand_name
        - company_address
        - description_of_contact
        - description_of_brand
        - isResidentOfEU
        - status
        - reviewed_at
        - response_message
        - created_at
    SellerApplicationPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SellerApplication"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
        - data
        - links
        - meta
    StripeEvent:
      type: object
      description: Stripe event envelope. Only id, type, and data.object (a Checkout
        Session with metadata.preorder_checkout_session_id) are read.
      properties:
        id:
          type: string
          example: evt_1Nv0XYZ
        type:
          type: string
          example: checkout.session.completed
        data:
          type: object
          properties:
            object:
              type: object
              additionalProperties: true
      required:
        - id
        - type
      additionalProperties: true
    StripeWebhookAck:
      type: object
      properties:
        received:
          type: boolean
          const: true
      required:
        - received
    SendcloudWebhookAck:
      type: object
      properties:
        success:
          type: boolean
          const: true
      required:
        - success
